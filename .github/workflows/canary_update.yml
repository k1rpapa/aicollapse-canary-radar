name: Canary Infrastructure Auto-Update

on:
  schedule:
    - cron: '0 21 * * 1-5' # 日本時間 火〜土曜 朝6:00 (UTC 月〜金 21:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12' # 3.10から3.12へアップグレード

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas
          pip install google-genai # generativeai から genai へ移行

      - name: Run Canary Monitor
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python canary_monitor.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dashboard_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update dashboard data" && git push)
